name: CI

on:
  push:
    branches: [main, master, cloudflare-d1-migration]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build Cloudflare Worker
        run: npm run cf:build
        env:
          SESSION_SECRET: ci-only-not-a-production-secret-change-this-value
          RESEND_API_KEY: re_test_placeholder
          RESEND_FROM: SR2 <ci@example.invalid>
